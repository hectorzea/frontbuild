name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  frontbuild-ui-tests:
    runs-on: ubuntu-latest
    steps:
      # 1. Descarga el código del repositorio
      - uses: actions/checkout@v4

      # 2. Configura Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Configura pnpm específicamente en la versión 11.20.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      # 3. Instala dependencias en /frontend
      - name: Install dependencies
        run: pnpm install

      # 4. Instala los navegadores de Playwright
      # Usamos 'pnpm playwright' para usar la versión instalada en el proyecto
      - name: Install Playwright Browsers
        run: pnpm playwright install --with-deps chromium

      # 5. Ejecuta las pruebas de Playwright
      - name: Run Playwright tests
        env:
          NEXT_PUBLIC_IS_E2E: ${{secrets.NEXT_PUBLIC_IS_E2E}}
        run: pnpm playwright test

      # 6. Sube el reporte de Playwright como artefacto
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          # Aseguramos que la ruta coincida con el directorio de trabajo
          path: frontend/playwright-report/
          retention-days: 30