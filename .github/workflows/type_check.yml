name: Type Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      # 1. Descarga el código del repositorio
      - uses: actions/checkout@v4

      # 2. Configura Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Configura pnpm (con caché automática)
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      # 3. Instala dependencias
      # Nota: Si tu proyecto está en una carpeta, recuerda agregar 'working-directory: ./frontend'
      - name: Install dependencies
        run: pnpm install

      # 4. Ejecuta el Type Check
      - name: Run Type Check
        run: pnpm run type-check