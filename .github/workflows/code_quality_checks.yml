name: Codecov Quality Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  code-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Configuramos pnpm y el caché global
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      # Instalamos dependencias
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Variables de entorno (con fallback por si corre desde Dependabot sin acceso a secrets)
      - name: Set environment variables
        run: |
          echo "TEST_API_URL=${{ secrets.TEST_API_URL || 'https://api-test.frontbuild.com' }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_FRONTBUILD_API_URL=${{ secrets.NEXT_PUBLIC_FRONTBUILD_API_URL || 'http://localhost:3000' }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_ENABLE_MSW=${{ secrets.NEXT_PUBLIC_ENABLE_MSW || 'true' }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_FRONTBUILD_HZ_SERVER_URL=${{ secrets.NEXT_PUBLIC_FRONTBUILD_HZ_SERVER_URL || 'http://localhost:3001' }}" >> $GITHUB_ENV

      # Ejecutamos con pnpm
      - name: Run Tests with Coverage
        run: pnpm test --coverage

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false