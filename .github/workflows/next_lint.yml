name: Lint Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # 1. Descarga el código del repositorio
      - uses: actions/checkout@v4

      # 2. Configura Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Configura pnpm (con caché automática)
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      # 3. Instala dependencias en /frontend
      - name: Install dependencies
        run: pnpm install

      # 4. Ejecuta el linter
      - name: Run Lint
        run: pnpm run lint