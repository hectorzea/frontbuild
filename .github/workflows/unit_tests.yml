name: Unit Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Configura Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # 2. Configura pnpm (esto instala pnpm y configura el caché automáticamente)
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      # 3. Instala dependencias con pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 4. Variables de entorno (con fallback por si corre desde Dependabot sin acceso a secrets)
      - name: Set environment variables
        run: |
          echo "TEST_API_URL=${{ secrets.TEST_API_URL || 'https://api-test.frontbuild.com' }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_FRONTBUILD_API_URL=${{ secrets.NEXT_PUBLIC_FRONTBUILD_API_URL || 'http://localhost:3000' }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_ENABLE_MSW=${{ secrets.NEXT_PUBLIC_ENABLE_MSW || 'true' }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_FRONTBUILD_HZ_SERVER_URL=${{ secrets.NEXT_PUBLIC_FRONTBUILD_HZ_SERVER_URL || 'http://localhost:3001' }}" >> $GITHUB_ENV

      # 5. Ejecuta los tests unitarios
      - name: Run Unit Tests
        run: pnpm run test